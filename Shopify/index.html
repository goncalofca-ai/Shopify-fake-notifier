<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#008060">
    <link rel="manifest" href="manifest.json">
    <title>Shopify Notifier</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f0f0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; padding: 20px;
            text-align: center;
        }
        h1 { color: #333; font-size: 22px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }
        button {
            width: 100%; max-width: 300px;
            padding: 16px; font-size: 16px; font-weight: bold;
            background: #008060; color: white; border: none; border-radius: 8px;
            cursor: pointer; margin-bottom: 10px;
        }
        button:active { background: #006e52; }
        button:disabled { background: #ccc; color: #fff; }
        #stopBtn { background: #d9534f; }
        #stopBtn:active { background: #c9302c; }
        #status { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <h1>Simulador de Vendas Shopify</h1>
    <p>Instale na tela inicial para rodar como app.</p>

    <button id="startBtn">Ativar Notificações</button>
    <button id="stopBtn" disabled>Parar</button>

    <div id="status">Aguardando autorização...</div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        let intervalId = null;
        let isRunning = false;

        // Registra o Service Worker (necessário para PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('SW registrado');
            }).catch(err => console.log('Erro SW:', err));
        }

        const products = ['Camiseta Premium', 'Tênis Esportivo', 'Fone Bluetooth', 'Mochila Casual', 'Relógio Digital'];
        const cities = ['São Paulo', 'Rio de Janeiro', 'Belo Horizonte', 'Curitiba', 'Porto Alegre', 'Salvador'];
        const states = ['SP', 'RJ', 'MG', 'PR', 'RS', 'BA'];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function getRandomValue(min, max) {
            return (Math.random() * (max - min) + min).toFixed(2);
        }

        function triggerNotification() {
            if (Notification.permission !== "granted") return;

            const product = getRandomItem(products);
            const city = getRandomItem(cities);
            const state = getRandomItem(states);
            const price = getRandomValue(50, 500);

            const title = "Nova venda na sua loja!";
            const options = {
                body: `Você vendeu 1x ${product} em ${city}-${state}. Valor: R$ ${price}`,
                icon: "https://cdn.shopify.com/s/files/1/0472/0931/5784/files/shopify-bag.png?v=1596060474",
                badge: "https://cdn.shopify.com/s/files/1/0472/0931/5784/files/shopify-bag.png?v=1596060474",
                vibrate: [200, 100, 200]
            };

            // Usa Service Worker para garantir notificação no telemóvel
            if (navigator.serviceWorker.controller) {
                navigator.serviceWorker.ready.then(registration => {
                    registration.showNotification(title, options);
                });
            } else {
                new Notification(title, options);
            }
        }

        startBtn.addEventListener('click', () => {
            if (!("Notification" in window)) {
                statusDiv.textContent = "Este navegador não suporta notificações.";
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    isRunning = true;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    statusDiv.textContent = "Notificações ativas. A cada 5 segundos.";

                    triggerNotification();
                    intervalId = setInterval(triggerNotification, 5000);
                } else {
                    statusDiv.textContent = "Permissão negada. Ative nas configurações do navegador.";
                }
            });
        });

        stopBtn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(intervalId);
                isRunning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                statusDiv.textContent = "Parado.";
            }
        });
    </script>
</body>
</html>
